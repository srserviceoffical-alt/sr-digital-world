<script>
  function toggleMobileMenu() {
    let menu = document.getElementById('mobileMenu');
    if(menu) {
      menu.classList.toggle('show-menu');
    }
  }

  // ==============================================================
  // AUTO-HIGHLIGHT SCRIPT (Yeh script khud check karegi kon sa page open hai)
  // ==============================================================
  function highlightActiveMenu() {
    let path = window.location.pathname;
    let page = path.split("/").pop(); // URL se page ka naam nikalna
    if (page === "" || page === "/") page = "index.html"; // Default page

    // Pehle sab buttons se active color hata do
    let links = document.querySelectorAll('.nav-link-item');
    links.forEach(link => link.classList.remove('active'));

    // Jo page open hai, us button par active color laga do
    links.forEach(link => {
      if (link.getAttribute('href') === page) {
        link.classList.add('active');
      }
    });

  }
  
  highlightActiveMenu();
</script>
